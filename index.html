<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>密码本 · Passbook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="密码本">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151716" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f4f1; --card:#ffffff; --text:#1b1d1c; --muted:#6b706d; --line:#e3e4df;
  --accent:#2f6b57; --accent-ink:#fff; --danger:#b3261e; --field:#f0f1ed;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151716; --card:#1f2221; --text:#ecedea; --muted:#9a9f9b; --line:#2e3230;
    --accent:#5fb394; --accent-ink:#0d1a15; --danger:#ff8a80; --field:#272b29;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px}

/* auth screens */
.auth{min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:14px}
.logo{width:64px;height:64px;border-radius:16px;margin-bottom:4px}
h1{font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 8px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.err{color:var(--danger);font-size:14px;min-height:20px}

/* inputs & buttons */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=url],input[type=search],textarea,select{
  width:100%;border:1px solid transparent;background:var(--field);border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;background:var(--field);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.icon-btn{appearance:none;border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;color:var(--text);display:inline-flex}
.icon-btn svg{width:22px;height:22px}

/* main */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;max-width:560px;margin:0 auto}
header.top .row{justify-content:space-between}
header.top h2{margin:0;font-size:24px}
.ver{font-size:12px;color:var(--muted)}
.search{margin-top:10px}
.list{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.count{font-size:13px;color:var(--muted);margin:14px 4px 6px}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}

/* sheets */
dialog{border:0;padding:0;background:var(--card);color:var(--text);width:min(560px,100vw);max-width:100vw;max-height:92dvh;
  margin:auto auto 0;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{background:var(--field);border-radius:12px;padding:10px 12px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{word-break:break-all;white-space:pre-wrap}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.gen{background:var(--field);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.gen .opts{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.gen label{display:flex;align-items:center;gap:6px}
input[type=range]{flex:1;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.meter-label{font-size:12px;color:var(--muted)}
.menu{display:flex;flex-direction:column;background:var(--field);border-radius:12px;overflow:hidden}
.menu button{border:0;background:transparent;text-align:left;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.menu button:last-child{border-bottom:0}
dialog{overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{flex:none;border:0;border-radius:999px;padding:6px 12px;background:var(--field);font-size:14px;cursor:pointer;white-space:nowrap;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip .n{opacity:.65;margin-left:4px;font-size:12px}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.tagcat{display:inline-block;font-size:11px;color:var(--muted);background:var(--field);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.catrow{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .cnt{font-size:12px;color:var(--muted);margin-right:4px;white-space:nowrap}
.catrow .btn.small{padding:6px 9px}
.catrow.sub{padding-left:30px;background:color-mix(in srgb,var(--field) 70%,var(--card))}
.catrow.sub .nm{color:var(--muted)}
.catrow .alt{font-size:12px;color:var(--muted)}
.chips.sub{margin-top:8px}
.chips.sub .chip{font-size:13px;padding:4px 10px;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chips.sub .chip.on{background:var(--card);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
select.inline{width:auto;padding:6px 10px;font-size:15px;background:var(--card)}
.pcard{background:var(--field);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pcard.off{opacity:.45}
.pcard .head{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.pcard .tag{font-size:12px;font-weight:400;color:var(--danger)}
.prow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prow input{background:var(--card)!important;padding:8px 10px!important;font-size:15px!important;color:var(--text)}
#pasteList{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
</style>
<style>
.langbar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right))}
.langbar .btn{background:var(--card);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="langbar hidden" id="langbar"><button class="btn small" type="button" id="langToggle"></button></div>

<!-- 首次设置 / Setup -->
<section id="setup" class="wrap auth hidden">
  <img class="logo" src="icon-180.png" alt="">
  <h1 data-i18n="setupTitle"></h1>
  <p class="sub" data-i18n="setupSub"></p>
  <form id="setupForm" class="auth" style="min-height:0;gap:12px">
    <div class="field"><label for="setupPw" data-i18n="setupPwLabel"></label>
      <input id="setupPw" type="password" autocomplete="new-password" required></div>
    <div class="meter"><i id="setupMeter"></i></div>
    <div class="field"><label for="setupPw2" data-i18n="setupPw2Label"></label>
      <input id="setupPw2" type="password" autocomplete="new-password" required></div>
    <div class="err" id="setupErr"></div>
    <button class="btn primary" type="submit" data-i18n="create"></button>
  </form>
  <p class="note" data-i18n-html="setupWarn"></p>
</section>

<!-- 解锁 / Lock -->
<section id="lock" class="wrap auth hidden">
  <img class="logo" src="icon-180.png" alt="">
  <h1 data-i18n="appName"></h1>
  <p class="sub" data-i18n="lockSub"></p>
  <form id="lockForm" class="auth" style="min-height:0;gap:12px">
    <input id="lockPw" type="password" autocomplete="current-password" data-i18n-ph="masterPw" required>
    <div class="err" id="lockErr"></div>
    <button class="btn primary" type="submit" id="unlockBtn" data-i18n="unlock"></button>
  </form>
</section>

<!-- 主界面 / Main -->
<section id="main" class="hidden">
  <header class="top">
    <div class="row">
      <div style="display:flex;align-items:baseline;gap:8px"><h2 data-i18n="appName"></h2><span id="appVer" class="ver"></span></div>
      <div class="row" style="gap:2px">
        <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn" id="lockBtn" data-i18n-aria="lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </div>
    <input id="search" class="search" type="search" data-i18n-ph="searchPh" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="chips sub hidden" id="subchips"></div>
  </header>
  <div class="wrap" style="padding-top:0;padding-bottom:110px">
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <div class="empty hidden" id="empty" data-i18n-html="emptyList"></div>
  </div>
  <button class="fab" id="addBtn" data-i18n-aria="add">＋</button>
</section>

<!-- 详情 / Detail -->
<dialog id="detailDlg">
  <div class="sheet">
    <div class="sheet-head"><h3 id="dTitle"></h3><button class="btn small" data-close data-i18n="close"></button></div>
    <div class="kv"><div class="row"><div class="grow k" style="font-size:13px" data-i18n="category"></div><select id="dCat" class="inline"></select></div></div>
    <div class="kv" id="dUserRow"><div class="row"><div class="grow"><div class="k" data-i18n="username"></div><div class="v" id="dUser"></div></div>
      <button class="btn small" id="dCopyUser" data-i18n="copy"></button></div></div>
    <div class="kv" id="dPwRow"><div class="row"><div class="grow"><div class="k" data-i18n="password"></div><div class="v mono" id="dPw"></div></div>
      <button class="btn small" id="dShowPw"></button><button class="btn small primary" id="dCopyPw" data-i18n="copy"></button></div></div>
    <div class="kv" id="dUrlRow"><div class="row"><div class="grow"><div class="k" data-i18n="url"></div><div class="v" id="dUrl"></div></div>
      <button class="btn small" id="dOpenUrl" data-i18n="open"></button></div></div>
    <div class="kv" id="dNoteRow"><div class="k" data-i18n="notes"></div><div class="v" id="dNote"></div></div>
    <div class="meter-label" id="dMeta"></div>
    <div class="row"><button class="btn grow" id="dEdit" data-i18n="edit"></button><button class="btn danger" id="dDelete" data-i18n="delete"></button></div>
  </div>
</dialog>

<!-- 编辑 / Edit -->
<dialog id="editDlg">
  <form class="sheet" id="editForm" method="dialog">
    <div class="sheet-head"><h3 id="eHead"></h3><button class="btn small" type="button" data-close data-i18n="cancel"></button></div>
    <div class="field"><label for="eName" data-i18n="name"></label><input id="eName" type="text" required data-i18n-ph="namePh" autocomplete="off"></div>
    <div class="field"><label for="eCat" data-i18n="category"></label>
      <div class="row"><select id="eCat" class="grow"></select><button class="btn small" type="button" id="eCatNew" data-i18n="newShort"></button></div></div>
    <div class="field"><label for="eUser" data-i18n="usernameAccount"></label><input id="eUser" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="ePw" data-i18n="password"></label>
      <div class="row"><input class="grow" id="ePw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn small" type="button" id="eToggle"></button>
        <button class="btn small" type="button" id="eGenToggle" data-i18n="generate"></button></div>
      <div class="meter"><i id="eMeter"></i></div><div class="meter-label" id="eMeterLabel"></div>
    </div>
    <div class="gen hidden" id="genBox">
      <div class="row"><span style="font-size:14px" data-i18n="length"></span><input type="range" id="gLen" min="8" max="40" value="20"><b id="gLenV" style="width:28px;text-align:right">20</b></div>
      <div class="opts">
        <label><input type="checkbox" id="gUpper" checked><span data-i18n="upper"></span></label>
        <label><input type="checkbox" id="gLower" checked><span data-i18n="lower"></span></label>
        <label><input type="checkbox" id="gDigit" checked><span data-i18n="digits"></span></label>
        <label><input type="checkbox" id="gSym" checked><span data-i18n="symbols"></span></label>
        <label><input type="checkbox" id="gAmb" checked><span data-i18n="avoidAmb"></span></label>
      </div>
      <button class="btn small primary" type="button" id="gRun" data-i18n="regenerate"></button>
    </div>
    <div class="field"><label for="eUrl" data-i18n="url"></label><input id="eUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://"></div>
    <div class="field"><label for="eNote" data-i18n="notes"></label><textarea id="eNote"></textarea></div>
    <button class="btn primary" type="submit" data-i18n="save"></button>
  </form>
</dialog>

<!-- 设置 / Settings -->
<dialog id="settingsDlg">
  <div class="sheet">
    <div class="sheet-head"><h3 data-i18n="settings"></h3><button class="btn small" data-close data-i18n="close"></button></div>
    <div class="field"><label for="sLang">语言 / Language</label>
      <select id="sLang"><option value="zh">中文</option><option value="en">English</option></select></div>
    <div class="field"><label for="sAutoLock" data-i18n="autoLock"></label>
      <select id="sAutoLock">
        <option value="0" data-i18n="al0"></option>
        <option value="60" data-i18n="al60"></option>
        <option value="300" data-i18n="al300"></option>
        <option value="900" data-i18n="al900"></option>
      </select></div>
    <div class="menu">
      <button id="sCats" data-i18n="manageCats"></button>
      <button id="sAutoCat" data-i18n="autoCat"></button>
    </div>
    <div class="menu">
      <button id="sSync" data-i18n="syncNow"></button>
      <button id="sSyncSave" data-i18n="syncSave"></button>
    </div>
    <p class="meter-label" style="margin-top:-6px"><span data-i18n="syncHelp"></span> <span id="syncInfo"></span></p>
    <div class="menu">
      <button id="sPaste" data-i18n="pasteImport"></button>
      <button id="sExport" data-i18n="exportBackup"></button>
      <button id="sImport" data-i18n="importBackup"></button>
      <button id="sChangePw" data-i18n="changePw"></button>
    </div>
    <div class="menu"><button id="sWipe" class="btn danger" style="border-radius:0;font-weight:600" data-i18n="wipe"></button></div>
    <p class="meter-label" data-i18n="cryptoNote"></p>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
    <input type="file" id="syncFile" accept=".json,application/json" class="hidden">
  </div>
</dialog>

<!-- 修改主密码 / Change password -->
<dialog id="pwDlg">
  <form class="sheet" id="pwForm" method="dialog">
    <div class="sheet-head"><h3 data-i18n="changePw"></h3><button class="btn small" type="button" data-close data-i18n="cancel"></button></div>
    <input id="pwOld" type="password" data-i18n-ph="pwOldPh" autocomplete="current-password" required>
    <input id="pwNew" type="password" data-i18n-ph="pwNewPh" autocomplete="new-password" required>
    <input id="pwNew2" type="password" data-i18n-ph="pwNew2Ph" autocomplete="new-password" required>
    <div class="err" id="pwErr"></div>
    <button class="btn primary" type="submit" data-i18n="confirmChange"></button>
  </form>
</dialog>

<!-- 同步完成 / Sync done -->
<dialog id="syncDlg">
  <div class="sheet">
    <div class="sheet-head"><h3 data-i18n="syncDoneTitle"></h3><button class="btn small" type="button" data-close data-i18n="later"></button></div>
    <p class="sub" style="margin:0" id="syncResult"></p>
    <p class="sub" style="margin:0" data-i18n="syncDoneNext"></p>
    <button class="btn primary" type="button" id="syncSaveBtn" data-i18n="syncSave"></button>
  </div>
</dialog>

<!-- 输入备份密码 / Backup password -->
<dialog id="impDlg">
  <form class="sheet" id="impForm" method="dialog">
    <div class="sheet-head"><h3 data-i18n="importBackupTitle"></h3><button class="btn small" type="button" data-close data-i18n="cancel"></button></div>
    <p class="sub" style="margin:0" id="impSubText" data-i18n-html="impSub"></p>
    <input id="impPw" type="password" data-i18n-ph="impPwPh" autocomplete="off" required>
    <div class="err" id="impErr"></div>
    <button class="btn primary" type="submit" data-i18n="import"></button>
  </form>
</dialog>

<!-- 管理分类 / Categories -->
<dialog id="catDlg">
  <div class="sheet">
    <div class="sheet-head"><h3 data-i18n="manageCats"></h3><button class="btn small" type="button" data-close data-i18n="done"></button></div>
    <button class="btn primary" type="button" id="catAddBtn" data-i18n="newCat"></button>
    <div class="menu" id="catList"></div>
    <p class="meter-label" style="margin:0" data-i18n="catDelNote"></p>
  </div>
</dialog>

<!-- 分类名称（中英文）/ Category names -->
<dialog id="catEditDlg">
  <form class="sheet" id="catEditForm" method="dialog">
    <div class="sheet-head"><h3 id="ceTitle"></h3><button class="btn small" type="button" id="ceCancel" data-i18n="cancel"></button></div>
    <div class="field"><label for="ceZh" data-i18n="nameZh"></label><input id="ceZh" type="text" maxlength="20" autocomplete="off" data-i18n-ph="phZh"></div>

// ---------- 加密 ----------
const b64 = u8 => { let s=''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const newId = () => crypto.randomUUID ? crypto.randomUUID() : b64(rand(16));

async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function seal(key, salt, iter, data){
  const iv = rand(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(JSON.stringify(data))));
  return { app:'passbook', v:1, kdf:{ name:'PBKDF2-SHA256', iter, salt:b64(salt) }, iv:b64(iv), ct:b64(ct) };
}
async function open(blob, pw){
  const salt = unb64(blob.kdf.salt);
  const key = await deriveKey(pw, salt, blob.kdf.iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(blob.iv) }, key, unb64(blob.ct));
  return { key, salt, iter: blob.kdf.iter, data: JSON.parse(dec.decode(pt)) };
}
function validBlob(o){
  return o && o.app === 'passbook' && o.kdf && typeof o.kdf.salt === 'string' && Number.isInteger(o.kdf.iter)
    && o.kdf.iter >= 10000 && typeof o.iv === 'string' && typeof o.ct === 'string';
}

// ---------- 会话状态（仅内存）----------
let session = null; // { key, salt, iter, vault:{entries:[], categories:[]} }

async function persist(){
  const blob = await seal(session.key, session.salt, session.iter, session.vault);
  if (!safeSet(STORE_KEY, JSON.stringify(blob))) toast(t('saveFail'));
}

  $('langbar').classList.toggle('hidden', view === 'main');
}
function closeAllDialogs(){ document.querySelectorAll('dialog[open]').forEach(d => d.close()); }

let toastTimer;
function toast(msg, ms = 1800){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function lock(){
  session = null; current = null;
  closeAllDialogs();
  $('lockPw').value = ''; $('lockErr').textContent = ''; $('search').value = '';
  $('list').replaceChildren();
  show('lock');
}

// ---------- 设置主密码 ----------
$('setupPw').addEventListener('input', e => paintMeter($('setupMeter'), null, e.target.value));
$('setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const a = $('setupPw').value, b = $('setupPw2').value;
  if (a.length < 1) return $('setupErr').textContent = t('errMin8');
  if (a !== b) return $('setupErr').textContent = t('errMismatch');
  $('setupErr').textContent = t('creating');
  const salt = rand(16);
  const key = await deriveKey(a, salt, ITER);
  session = { key, salt, iter: ITER, pw: a, vault: { entries: [] } };
  ensureCats();
  await persist();
  $('setupPw').value = $('setupPw2').value = '';
  $('setupErr').textContent = '';
  requestPersistentStorage();
  enterMain();
});

// ---------- 解锁 ----------
let failCount = 0;
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('unlockBtn'); btn.disabled = true; $('lockErr').textContent = t('unlocking');
  try {
    const blob = JSON.parse(safeGet(STORE_KEY));
    const r = await open(blob, $('lockPw').value);
    session = { key:r.key, salt:r.salt, iter:r.iter, pw: $('lockPw').value, vault:r.data };
    if (!Array.isArray(session.vault.entries)) session.vault.entries = [];
    failCount = 0; $('lockPw').value = ''; $('lockErr').textContent = '';
    enterMain();
  } catch {
    failCount++;
    $('lockErr').textContent = t('wrongPw');
    $('lockPw').select();
    if (failCount >= 3) { await new Promise(r => setTimeout(r, Math.min(30, 2 ** (failCount - 2)) * 1000)); }
  } finally { btn.disabled = false; }
});

];
const RULE_ORDER = ['apple', 'email', 'bank', 'social', 'shop', 'work'];
// catFilter: 'all' | '' (未分类) | 分类或子分类 id | 'd:'+大分类id（只看直接放在大分类里、没细分的）
let catFilter = 'all';
function ensureCats(){
  let changed = false;
  if (!Array.isArray(session.vault.categories)) {
    session.vault.categories = CAT_DEFS.map(d => ({ id: newId(), key: d.key, name: d[lang] }));
    changed = true;
  }
  // 旧版本建的默认分类没有 key，按名字认回来，这样才能随语言切换
  for (const c of session.vault.categories) {
    if (c.key || c.names || c.parent) continue;
    const d = CAT_DEFS.find(x => (c.name === x.zh || c.name === x.en) && !session.vault.categories.some(o => o.key === x.key));
    if (d) { c.key = d.key; changed = true; }
  }
  // 只允许一层子分类：父分类必须存在且本身是大分类
  for (const c of session.vault.categories) {
    if (c.parent) { const p = session.vault.categories.find(x => x.id === c.parent); if (!p || p.parent) { delete c.parent; changed = true; } }
  }
  return changed;
}
const cats = () => session.vault.categories;
const catById = id => cats().find(c => c.id === id);
const topCats = () => cats().filter(c => !c.parent);

const siblingsOf = c => cats().filter(x => (x.parent || '') === (c.parent || ''));
const catOf = e => (e.cat && catById(e.cat)) ? e.cat : '';
const topOf = id => { const c = catById(id); return c ? (c.parent || c.id) : ''; };
// ---- 分类名称（中英文）----
// 默认分类（有 key、没改过名）自动跟随语言；自建或改过名的用 c.names = { zh, en }，缺哪个就显示另一个
function namesOf(c){
  if (!c) return { zh:'', en:'' };
  if (c.names) return { zh: c.names.zh || '', en: c.names.en || '' };
  const d = c.key && CAT_DEFS.find(x => x.key === c.key);
  if (d && (c.name === d.zh || c.name === d.en)) return { zh: d.zh, en: d.en };
  return /[㐀-鿿]/.test(c.name || '') ? { zh: c.name, en: '' } : { zh: '', en: c.name || '' };
}
function catName(c){ const n = namesOf(c); return n[lang] || n.zh || n.en || ''; }
function setNames(c, zh, en){ c.names = { zh, en }; c.name = zh || en; }
// 同一层里是否已有同名（任一语言的名字相同都算）
function nameTaken(sibs, zh, en, exceptId){
  const want = [zh, en].filter(Boolean);
  return sibs.some(x => x.id !== exceptId && Object.values(namesOf(x)).some(v => v && want.includes(v)));
}
function catLabel(id){

function inFilter(e, f){

  if (f === 'all') return true;

}

const SETS = { upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower:'abcdefghijklmnopqrstuvwxyz', digit:'0123456789', sym:'!@#$%^&*()-_=+[]{};:,.?/~' };
const AMBIG = /[Il1O0o|`'"]/g;
function randInt(n){ // 无偏随机
  const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= max);
  return buf[0] % n;
}
function generate(len, opt){
  let sets = Object.keys(SETS).filter(k => opt[k]).map(k => opt.amb ? SETS[k].replace(AMBIG,'') : SETS[k]);
  if (!sets.length) sets = [SETS.lower];
  const pool = sets.join('');
  const out = sets.map(s => s[randInt(s.length)]); // 每类至少一个
  while (out.length < len) out.push(pool[randInt(pool.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = randInt(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}
function runGen(){
  $('gLenV').textContent = $('gLen').value;
  $('ePw').value = generate(+$('gLen').value, { upper:$('gUpper').checked, lower:$('gLower').checked, digit:$('gDigit').checked, sym:$('gSym').checked, amb:$('gAmb').checked });
  setPwVisible(true);
  paintMeter($('eMeter'), $('eMeterLabel'), $('ePw').value);
}

function strength(pw){
  if (!pw) return 0;
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26;
  if (/\d/.test(pw)) pool += 10; if (/[^a-zA-Z\d]/.test(pw)) pool += 30;
  const uniq = new Set(pw).size;
  return Math.log2(Math.max(pool, 2)) * Math.min(pw.length, uniq * 2);
}
function paintMeter(bar, label, pw){
  const bits = strength(pw);
  const [w, c, k] = bits < 40 ? [25,'#c0392b','weak'] : bits < 60 ? [50,'#d68910','fair'] : bits < 80 ? [75,'#7cb342','strong'] : [100,'#2e7d32','vstrong'];
  bar.style.width = pw ? w + '%' : '0'; bar.style.background = c;
  if (label) label.textContent = pw ? t('strength', { t: t(k) }) : '';
}

// ---------- 合并（导入备份和同步共用）----------
function tombs(){
  const v = session.vault;
  if (!v.tomb || typeof v.tomb !== 'object') v.tomb = { e:{}, c:{} };
  v.tomb.e ||= {}; v.tomb.c ||= {};
  return v.tomb;
}
function tomb(kind, id){ tombs()[kind][id] = Date.now(); }

function mergeVault(data){
  const T = tombs();
  // 1. 删除记录取并集（保留较新的时间）
  const inT = data && data.tomb && typeof data.tomb === 'object' ? data.tomb : {};
  for (const k of ['e','c']) for (const [id, ts] of Object.entries(inT[k] || {}))
    if (typeof ts === 'number' && ts > (T[k][id] || 0)) T[k][id] = ts;

  // 2. 合并分类（先大分类，再子分类），跳过已删除的
  const remap = {};
  const incCats = (Array.isArray(data.categories) ? data.categories : [])
    .filter(c => c && typeof c.id === 'string' && (typeof c.name === 'string' || c.names) && !T.c[c.id]);
  for (const c of [...incCats.filter(c => !c.parent), ...incCats.filter(c => c.parent)]) {
    if (catById(c.id)) continue;
    let parent = c.parent ? (remap[c.parent] || c.parent) : '';
    if (parent && (!catById(parent) || catById(parent).parent)) parent = '';
    const n = namesOf(c);
    const sibs = cats().filter(x => (x.parent || '') === parent);
    const same = sibs.find(x => (!parent && c.key && x.key === c.key) || nameTaken([x], n.zh, n.en));
    if (same) { remap[c.id] = same.id; continue; }
    const nc = { id: c.id, name: String(c.name || n.zh || n.en).slice(0, 20) };
    if (c.names) nc.names = { zh: String(c.names.zh || '').slice(0, 20), en: String(c.names.en || '').slice(0, 20) };
    if (c.key && !parent) nc.key = c.key;
    if (parent) nc.parent = parent;
    cats().push(nc);
  }

  // 3. 本机删掉另一台设备已删除的分类：子分类的密码移回上一级，大分类的密码变成未分类
  const gone = cats().filter(c => T.c[c.id]);
  if (gone.length) {
    const goneIds = new Set(gone.map(c => c.id));
    for (const c of cats()) if (c.parent && goneIds.has(c.parent)) goneIds.add(c.id);
    const moveTo = id => { const c = catById(id); return c && c.parent && !goneIds.has(c.parent) ? c.parent : ''; };
    for (const e of session.vault.entries) if (e.cat && goneIds.has(e.cat)) e.cat = moveTo(e.cat);
    session.vault.categories = cats().filter(c => !goneIds.has(c.id));
  }

  // 4. 合并密码条目：较新的修改胜出；删除时间晚于最后修改的条目会被删掉
  let added = 0, updated = 0, removed = 0;
  for (const inc of (Array.isArray(data.entries) ? data.entries : [])) {
    if (!inc || typeof inc.name !== 'string' || !inc.id) continue;
    if (T.e[inc.id] && T.e[inc.id] >= (inc.updated || 0)) continue;
    if (inc.cat && remap[inc.cat]) inc.cat = remap[inc.cat];
    const ex = session.vault.entries.find(x => x.id === inc.id);
    if (!ex) { session.vault.entries.push(inc); added++; }
    else if ((inc.updated || 0) > (ex.updated || 0)) { Object.assign(ex, inc); updated++; }
  }
  const before = session.vault.entries.length;
  session.vault.entries = session.vault.entries.filter(e => !(T.e[e.id] && T.e[e.id] >= (e.updated || 0)));
  removed = before - session.vault.entries.length;

  // 5. 指向不存在分类的条目设为未分类
  for (const e of session.vault.entries) if (e.cat && !catById(e.cat)) e.cat = '';
  return { added, updated, removed };
}

// ---------- 从记事本导入 ----------
const LABELS = {
  name: ['网站名','名称','名字','平台','应用','app','name'],
  user: ['登录账号','登录名','用户名','账号','帐号','账户','帐户','用户','电子邮箱','邮箱','手机号','手机','电话','username','email','e-mail','user','login','id'],
  pw:   ['登录密码','密码','口令','password','passwd','pass','pwd','pw'],
  url:  ['网址','网站','链接','官网','website','url','site','link'],
  note: ['备注','说明','注释','notes','note','memo'],
};
const FIELD = {}; for (const [f, ws] of Object.entries(LABELS)) for (const w of ws) FIELD[w.toLowerCase()] = f;
const ALL = Object.keys(FIELD).sort((a, b) => b.length - a.length).map(w => w.replace(/[-]/g, '\\-')).join('|');
const RE_LABEL = new RegExp(`(?:^|[\\s,，;；|])(${ALL})\\s*[:：=]\\s*`, 'gi');
const RE_LEAD = new RegExp(`^(${ALL})\\s+(\\S.*)$`, 'i');
const BULLET = /^\s*(?:[•·▪◦*\-–—>]+|\d{1,3}[.、)）])\s+/;
const CJK = /[㐀-鿿＀-￯]/;
const looksUrl = s => /^(https?:\/\/|www\.)\S+$/i.test(s) || (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(s) && !s.includes('@') && /[a-z]/i.test(s) && !/^\d+(\.\d+)*$/.test(s));

function labelSegments(line){
  RE_LABEL.lastIndex = 0;
  const hits = []; let m;
  while ((m = RE_LABEL.exec(line))) hits.push({ field: FIELD[m[1].toLowerCase()], start: m.index, valStart: m.index + m[0].length });
  if (!hits.length) {
    const m2 = line.match(RE_LEAD);
    return m2 ? { pre: '', segs: [{ field: FIELD[m2[1].toLowerCase()], value: m2[2].trim() }] } : null;
  }
  return {
    pre: line.slice(0, hits[0].start).trim().replace(/[:：\-–—|]+$/, '').trim(),
    segs: hits.map((h, i) => ({ field: h.field, value: line.slice(h.valStart, i + 1 < hits.length ? hits[i + 1].start : line.length).trim() })),
  };
}

function parseNotes(text){
  const out = []; let cur = null, loose = 0;
  const fresh = () => ({ name:'', user:'', pw:'', url:'', note:'' });
  const flush = () => { if (cur && (cur.name || cur.user || cur.pw)) out.push(cur); cur = null; loose = 0; };
  const add = (f, v) => {
    if (!v) return;
    if (f !== 'note' && !cur[f]) cur[f] = v;
    else cur.note = cur.note ? cur.note + '\n' + v : v;
  };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(BULLET, '').trim();
    if (!line) { flush(); continue; }
    if (!cur) cur = fresh();
    const ls = labelSegments(line);
    if (ls) {
      if (ls.pre) { if (cur.user || cur.pw) { flush(); cur = fresh(); } if (!cur.name) cur.name = ls.pre; else add('note', ls.pre); }
      for (const s of ls.segs) { if (s.field === 'name' && (cur.user || cur.pw)) { flush(); cur = fresh(); } add(s.field, s.value); }
      continue;
    }
    if (looksUrl(line) && !cur.url) { cur.url = line; continue; }
    const tokens = line.split(/\s+/);
    const isFresh = !cur.name && !cur.user && !cur.pw;
    if (!isFresh && cur.user && cur.pw) { flush(); cur = fresh(); }
    else if (!isFresh && cur.name && tokens.length === 1 && !CJK.test(line) && loose < 2) {
      // 名称下面不带标签的两行：先账号、后密码
      if (loose === 0 && !cur.user) cur.user = line; else if (!cur.pw) cur.pw = line; else add('note', line);
      loose++; continue;
    }
    else if (!isFresh) { if (cur.pw) { flush(); cur = fresh(); } else { add('note', line); continue; } }
    // 新条目的第一行
    if (tokens.length >= 3 && !CJK.test(tokens.at(-1)) && !CJK.test(tokens.at(-2))) {
      cur.name = tokens.slice(0, -2).join(' '); cur.user = tokens.at(-2); cur.pw = tokens.at(-1);
    } else if (tokens.length === 2 && CJK.test(tokens[0]) && !CJK.test(tokens[1]) && /\d/.test(tokens[1])) {
      cur.name = tokens[0]; cur.pw = tokens[1];
    } else cur.name = line;
  }
  flush();
  return out;
}

let parsed = [];
const PASTE_CAT_OPTS = { withAuto: true, withNew: true };
function pasteStep(n){ $('pasteStep1').classList.toggle('hidden', n !== 1); $('pasteStep2').classList.toggle('hidden', n !== 2); }
function updatePasteCount(){
  const n = parsed.filter(p => p.on).length;
  $('pasteImport').textContent = t('importN', { n }); $('pasteImport').disabled = n === 0;
  $('pasteSummary').textContent = t('pasteSummary', { a: parsed.length, b: n });
}
function renderPreview(){
  $('pasteList').replaceChildren(...parsed.map((p, i) => {
    const c = document.createElement('div'); c.className = 'pcard' + (p.on ? '' : ' off');
    const head = document.createElement('label'); head.className = 'head';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = p.on;
    cb.addEventListener('change', () => { p.on = cb.checked; c.classList.toggle('off', !p.on); updatePasteCount(); });
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = p.dup ? t('dupTag') : (!p.pw ? t('noPwTag') : '');
    head.append(cb, document.createTextNode(t('itemN', { i: i + 1 })), tag);
    c.append(head);
    for (const [f, label] of [['name', t('name')], ['user', t('account')], ['pw', t('password')], ['url', t('url')], ['note', t('notes')]]) {
      if (f === 'url' && !p.url || f === 'note' && !p.note) continue;
      const row = document.createElement('label'); row.className = 'prow';
      const sp = document.createElement('span'); sp.textContent = label;
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = p[f];
      inp.autocapitalize = 'off'; inp.spellcheck = false; inp.autocomplete = 'off';
      inp.addEventListener('input', () => { p[f] = inp.value; });
      row.append(sp, inp); c.append(row);
    }
    return c;
  }));
  updatePasteCount();
}
$('sPaste').addEventListener('click', () => {
  $('pasteText').value = ''; parsed = []; pasteStep(1);
  $('settingsDlg').close(); $('pasteDlg').showModal();
});
$('pasteClip').addEventListener('click', async () => {

});
$('pasteParse').addEventListener('click', () => {
  const key = e => (e.name || '').trim().toLowerCase() + '|' + (e.user || '').trim().toLowerCase();
  const have = new Set(session.vault.entries.map(key));
  parsed = parseNotes($('pasteText').value).map(p => { const dup = have.has(key(p)); return { ...p, dup, on: !!p.pw && !dup }; });
  if (!parsed.length) return toast(t('nothingFound'));
  fillCatSelect($('pasteCat'), '__auto', PASTE_CAT_OPTS);
  pasteStep(2); renderPreview();
});
bindCatSelect($('pasteCat'), null, PASTE_CAT_OPTS);
$('pasteBack').addEventListener('click', () => pasteStep(1));
$('pasteImport').addEventListener('click', async () => {
  const now = Date.now(); let n = 0;
  const pc = $('pasteCat').value;
  for (const p of parsed) {
    if (!p.on) continue;
    const name = p.name.trim() || p.user.trim() || t('untitled');
    const e = { id: newId(), name, user: p.user.trim(), pw: p.pw, url: p.url.trim(), note: p.note, created: now, updated: now };
    e.cat = pc === '__auto' ? guessCat(e) : (pc === '__new' ? '' : pc);
    session.vault.entries.push(e);
    n++;
  }
  await persist(); parsed = []; $('pasteText').value = '';
  $('pasteDlg').close(); renderList();
  toast(t('pasteDone', { n }), 5000);
});

// ---------- 管理分类 ----------
function openCatManager(){
  if ($('settingsDlg').open) $('settingsDlg').close();
  renderCatList(); $('catDlg').showModal();
}
function catRow(c){
  const es = session.vault.entries;
  const isSub = !!c.parent;
  const row = document.createElement('div'); row.className = 'catrow' + (isSub ? ' sub' : '');
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (isSub ? '↳ ' : '') + catName(c);
  // 有另一种语言的名字时，小字显示出来
  const nn = namesOf(c), other = lang === 'zh' ? nn.en : nn.zh;
  if (other && other !== catName(c)) { const o = document.createElement('span'); o.className = 'alt'; o.textContent = ' · ' + other; nm.append(o); }
  const cnt = document.createElement('span'); cnt.className = 'cnt';
  cnt.textContent = t('nItems', { n: es.filter(e => inFilter(e, c.id)).length });
  const btn = (label, fn, cls = '', aria = '') => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small ' + cls; b.textContent = label;
    if (aria) { b.setAttribute('aria-label', aria); b.title = aria; }
    b.addEventListener('click', fn); return b;
  };
  const sibs = siblingsOf(c), si = sibs.indexOf(c);
  const up = btn('↑', async () => {
    const a = cats().indexOf(sibs[si - 1]), b = cats().indexOf(c);
    [cats()[a], cats()[b]] = [cats()[b], cats()[a]]; await persist(); renderCatList();
  }, '', t('moveUp'));
  up.disabled = si === 0;
  const parts = [nm, cnt, up];
  if (!isSub) parts.push(btn('＋', async () => {
    const res = await openCatEditor({ title: t('newSubPrompt', { name: catName(c) }), check: (zh, en) => nameTaken(subsOf(c.id), zh, en) });
    if (!res || !session) return;
    addCategory(res, c.id); await persist(); renderCatList();
  }, '', t('addSub')));
  parts.push(
    btn(t('rename'), async () => {
      const cur = namesOf(c);
      const res = await openCatEditor({ title: t('editCat'), zh: cur.zh, en: cur.en, check: (zh, en) => nameTaken(sibs, zh, en, c.id) });
      if (!res || !session) return;
      if (res.zh === cur.zh && res.en === cur.en) return;
      setNames(c, res.zh, res.en); await persist(); renderCatList();
    }),
    btn(t('delete'), async () => {
      if (isSub) {
        // 删子分类：里面的密码移回上一级
        const n = es.filter(e => e.cat === c.id).length;
        const p = catById(c.parent);
        if (!confirm(t('confirmDelSub', { name: catName(c) }) + (n ? t('confirmDelSubN', { n, parent: catName(p) }) : ''))) return;
        for (const e of es) if (e.cat === c.id) e.cat = p.id;
        session.vault.categories = cats().filter(x => x.id !== c.id);
        tomb('c', c.id);
      } else {
        // 删大分类：连同子分类一起删，里面的密码变成未分类
        const subs = subsOf(c.id), ids = new Set([c.id, ...subs.map(s => s.id)]);
        const n = es.filter(e => ids.has(e.cat)).length;
        const msg = (subs.length ? t('confirmDelCatTree', { name: catName(c), s: subs.length }) : t('confirmDelCat', { name: catName(c) }))
          + (n ? t('confirmDelCatN', { n }) : '');
        if (!confirm(msg)) return;
        for (const e of es) if (ids.has(e.cat)) e.cat = '';
        session.vault.categories = cats().filter(x => !ids.has(x.id));
        for (const id of ids) tomb('c', id);
      }
      await persist(); renderCatList();
    }, 'danger'));
  row.append(...parts);
  return row;
}
function renderCatList(){
  const list = [];
  for (const c of topCats()) { list.push(catRow(c)); for (const s of subsOf(c.id)) list.push(catRow(s)); }
  if (!list.length) { const p = document.createElement('div'); p.className = 'catrow'; p.textContent = t('noCats'); list.push(p); }
  $('catList').replaceChildren(...list);
}
$('sCats').addEventListener('click', openCatManager);
$('catDlg').addEventListener('close', () => { if (session) renderList(); });
$('catAddBtn').addEventListener('click', async () => {
  const res = await openCatEditor({ title: t('newCat'), check: (zh, en) => nameTaken(topCats(), zh, en) });
  if (!res || !session) return;

});
$('sAutoCat').addEventListener('click', async () => {
  const todo = session.vault.entries.filter(e => !catOf(e));
  if (!todo.length) return toast(t('allHaveCat'));
  let n = 0;
  for (const e of todo) { const c = guessCat(e); if (c) { e.cat = c; e.updated = Date.now(); n++; } }
  await persist(); $('settingsDlg').close(); catFilter = 'all'; renderList();
  toast(t('autoCatDone', { n }) + (todo.length - n ? t('autoCatRest', { m: todo.length - n }) : ''), 4000);
});

document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

// ---------- 自动锁定 ----------
let lastActive = Date.now(), hiddenAt = 0;
function touch(){ lastActive = Date.now(); }
['pointerdown','keydown','scroll','input'].forEach(ev => addEventListener(ev, touch, { passive:true, capture:true }));
setInterval(() => { if (session && prefs.autoLock > 0 && Date.now() - lastActive > prefs.autoLock * 1000) lock(); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (session && prefs.autoLock === 0) lock(); }
  else if (session && prefs.autoLock > 0 && Date.now() - hiddenAt > prefs.autoLock * 1000) lock();
});

async function requestPersistentStorage(){ try { await navigator.storage?.persist?.(); } catch {} }

// ---------- 启动 ----------
document.getElementById('appVer').textContent = 'v' + APP_VERSION;
applyI18n();
if (!window.isSecureContext || !crypto.subtle) {
  const w = document.createElement('div'); w.className = 'wrap auth';
  const h = document.createElement('h1'); h.textContent = t('insecureTitle');
  const p = document.createElement('p'); p.className = 'sub'; p.textContent = t('insecureMsg');
  w.append(h, p); document.body.replaceChildren(w);
  return;
}
let existing = null;
try { existing = JSON.parse(safeGet(STORE_KEY)); } catch {}
show(validBlob(existing) ? 'lock' : 'setup');
requestPersistentStorage();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
